[project]
name = "customer-support"
version = "0.1.0"
description = "Multi-agent customer support system built on AutoGen: a Manager delegates to IT, HR and Billing Specialists."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "autogen-agentchat>=0.7",
    "autogen-ext>=0.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
openai = ["autogen-ext[openai]>=0.7"]  # real model; demo mode needs no key
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["support*"]

[tool.setuptools.package-data]
support = ["knowledge/*.md", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]  # upstream notice, harmless

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
