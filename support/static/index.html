<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Support</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1c2128; --muted: #667085; --line: #e3e6ea;
    --accent: #3b5bdb; --accent-text: #fff; --you: #e8edff; --them: #f1f3f5; --error: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --card: #1b1f26; --text: #e8eaed; --muted: #98a2b3; --line: #2d333b;
      --accent: #748ffc; --accent-text: #0f1217; --you: #26304f; --them: #242a33; --error: #ff8787;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  label { display: block; font-size: .875rem; font-weight: 600; margin: 14px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input, textarea { width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { min-height: 110px; resize: vertical; }
  button { margin-top: 16px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
    color: var(--accent-text); background: var(--accent); border: 0; border-radius: 8px; }
  button:disabled { opacity: .6; cursor: progress; }
  .error { color: var(--error); font-size: .9rem; margin-top: 12px; min-height: 1.2em; }
  .hidden { display: none; }
  .thread-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .thread-head a { color: var(--accent); font-size: .9rem; }
  .messages { display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; background: var(--them); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.you { align-self: flex-end; background: var(--you); }
  .who { display: block; font-size: .75rem; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
  .thinking { color: var(--muted); font-style: italic; }
  #follow-form { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 4px; }
  #follow-form textarea { min-height: 70px; }
</style>
</head>
<body>
<main>
  <h1>Customer Support</h1>
  <p class="sub">Ask a question and the right specialist (IT, HR or Billing) will answer.</p>

  <section id="new" class="card">
    <form id="request-form" novalidate>
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="message">How can we help?</label>
      <textarea id="message" name="message" maxlength="2000" required></textarea>
      <button type="submit">Send request</button>
      <div class="error" role="alert" id="request-error"></div>
    </form>
  </section>

  <section id="thread" class="card hidden" aria-live="polite">
    <div class="thread-head">
      <strong>Your conversation</strong>
      <a href="/" id="new-link">Start a new request</a>
    </div>
    <div class="messages" id="messages"></div>
    <form id="follow-form" novalidate>
      <label for="follow">Follow-up</label>
      <textarea id="follow" maxlength="2000" required></textarea>
      <button type="submit">Send</button>
      <div class="error" role="alert" id="follow-error"></div>
    </form>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let threadId = null;
const THREAD_ID = /^[0-9a-f]{32}$/; // matches the server-generated id format
const threadPath = (id) => `/threads/${encodeURIComponent(id)}`;

function errorText(body, status) {
  const d = body && body.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d) && d.length) {
    const field = d[0].loc[d[0].loc.length - 1];
    return `Please check the ${field} field.`;
  }
  return `Something went wrong (${status}). Please try again.`;
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error(errorText(body, res.status));
  return body;
}

function render(messages, pending) {
  const box = $("messages");
  box.replaceChildren();
  for (const m of messages) {
    const div = document.createElement("div");
    div.className = "msg" + (m.sender === "customer" ? " you" : "");
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = m.sender === "customer" ? "You" : m.sender;
    div.append(who, document.createTextNode(m.text));
    box.append(div);
  }
  if (pending) {
    const div = document.createElement("div");
    div.className = "msg thinking";
    div.textContent = "Finding the right specialist…";
    box.append(div);
  }
}

function show(id) {
  threadId = id;
  $("new").classList.add("hidden");
  $("thread").classList.remove("hidden");
  history.replaceState(null, "", `/?thread=${id}`);
}

async function load(id) {
  try {
    const t = await api(threadPath(id));
    show(id);
    render(t.messages);
  } catch (e) {
    $("request-error").textContent = "We couldn't find that conversation.";
  }
}

$("request-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = ev.target.querySelector("button");
  $("request-error").textContent = "";
  const payload = { name: $("name").value, email: $("email").value, message: $("message").value };
  btn.disabled = true;
  try {
    const r = await api("/requests", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
    });
    await load(r.thread_id);
  } catch (e) {
    $("request-error").textContent = e.message;
  } finally {
    btn.disabled = false;
  }
});

$("follow-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = ev.target.querySelector("button");
  $("follow-error").textContent = "";
  const text = $("follow").value;
  btn.disabled = true;
  try {
    const current = (await api(threadPath(threadId))).messages;
    render([...current, { sender: "customer", text }], true);
    await api(`${threadPath(threadId)}/messages`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }),
    });
    $("follow").value = "";
  } catch (e) {
    $("follow-error").textContent = e.message;
  } finally {
    btn.disabled = false;
    render((await api(threadPath(threadId))).messages);
  }
});

const existing = new URLSearchParams(location.search).get("thread");
if (existing && THREAD_ID.test(existing)) load(existing);
</script>
</body>
</html>
